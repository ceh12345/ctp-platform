name: Deploy

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for deployment
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build engine
        run: npm run build --workspace=@ctp/engine

      - name: Build API
        run: npm run build --workspace=@ctp/api

      - name: Type-check API
        run: npx tsc --noEmit -p packages/api/tsconfig.json

      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ctp-platform-api

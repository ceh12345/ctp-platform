name: Build and Deploy to Azure
run-name: "Deploy — ${{ github.event.inputs.reason }}"

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for deployment
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build engine
        run: cd packages/engine && npm run build

      - name: Build API
        run: cd packages/api && npm run build

      - name: Type-check API
        run: npx tsc --noEmit -p packages/api/tsconfig.json

      # Assemble deployment package with only runtime files
      # Directory layout mirrors the monorepo so config path resolution works:
      #   deploy/packages/api/dist/   (compiled API — node starts here)
      #   deploy/packages/engine/dist/ (compiled engine)
      #   deploy/config/tenants/       (tenant data)
      #   deploy/node_modules/         (production deps)
      #   deploy/package.json          (root workspace manifest)
      - name: Assemble deployment package
        run: |
          mkdir -p deploy/packages/api deploy/packages/engine
          cp -r packages/api/dist deploy/packages/api/dist
          cp packages/api/package.json deploy/packages/api/package.json
          cp -r packages/engine/dist deploy/packages/engine/dist
          cp packages/engine/package.json deploy/packages/engine/package.json
          cp -r config deploy/config
          cp package.json deploy/package.json
          cp package-lock.json deploy/package-lock.json
          cd deploy && npm ci --omit=dev && cd ..

      - name: Create deployment zip
        run: cd deploy && zip -r ../deploy.zip . && cd ..

      - uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ctp-platform-api
          package: deploy.zip
          startup-command: node packages/api/dist/src/main.js

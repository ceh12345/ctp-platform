name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build engine
        run: cd packages/engine && npm run build

      - name: Build API
        run: cd packages/api && npm run build

      - name: Type-check API
        run: npx tsc --noEmit -p packages/api/tsconfig.json
